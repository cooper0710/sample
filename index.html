<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Login Form Styling */
    .login-card {
      background-color: var(--card-bg);
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 360px;
      text-align: center;
    }

    .login-card h2 {
      margin-top: 0;
      margin-bottom: 1.5rem;
    }

    .input-group {
      margin-bottom: 1.25rem;
      text-align: left;
    }

    .input-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .input-group input {
      width: 100%;
      padding: 0.75rem;
      border-radius: 6px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #fff;
      box-sizing: border-box;
      font-size: 1rem;
    }

    .input-group input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 6px;
      background-color: var(--accent);
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .error-msg {
      color: #ef4444;
      font-size: 0.875rem;
      margin-top: 1rem;
      display: none;
    }

    /* Celebration Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 10;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 3rem 2rem;
      border-radius: 16px;
      text-align: center;
      position: relative;
      box-shadow: 0 0 30px rgba(99, 102, 241, 0.4);
      max-width: 400px;
      width: 90%;
      z-index: 20;
    }

    .modal-content h1 {
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
      color: #facc15;
      text-shadow: 0 0 10px rgba(250, 204, 21, 0.5);
    }

    .video-btn {
      display: inline-block;
      text-decoration: none;
      padding: 0.85rem 2rem;
      background-color: #22c55e;
      color: white;
      font-weight: bold;
      border-radius: 50px;
      box-shadow: 0 4px 14px rgba(34, 197, 94, 0.4);
      transition: transform 0.2s, background 0.2s;
    }

    .video-btn:hover {
      background-color: #16a34a;
      transform: scale(1.05);
    }

    /* Celebration Lights Effect */
    .lights-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
    }

    .light-string {
      position: absolute;
      top: -10px;
      width: 100%;
      display: flex;
      justify-content: space-around;
    }

    .bulb {
      width: 14px;
      height: 20px;
      border-radius: 50%;
      animation: flash 1s infinite alternate;
    }

    .bulb:nth-child(4n+1) { background: #ff2a75; box-shadow: 0 0 15px #ff2a75; animation-delay: 0s; }
    .bulb:nth-child(4n+2) { background: #04d9ff; box-shadow: 0 0 15px #04d9ff; animation-delay: 0.25s; }
    .bulb:nth-child(4n+3) { background: #ffb800; box-shadow: 0 0 15px #ffb800; animation-delay: 0.5s; }
    .bulb:nth-child(4n+4) { background: #00ff66; box-shadow: 0 0 15px #00ff66; animation-delay: 0.75s; }

    @keyframes flash {
      0% { opacity: 0.3; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1.1); }
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>Account Login</h2>
    <form id="loginForm">
      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" required autocomplete="off">
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" class="btn">Log In</button>
      <div id="errorMsg" class="error-msg">Invalid username or password!</div>
    </form>
  </div>

  <div class="modal-overlay" id="celebrationModal">
    <div class="lights-container">
      <div class="light-string">
        <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
        <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
        <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
        <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
      </div>
    </div>
    
    <div class="modal-content">
      <h1>Congratulations! You are happily logged in! 🎉</h1>
      <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" class="video-btn">Click Here</a>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const celebrationModal = document.getElementById('celebrationModal');

    loginForm.addEventListener('submit', function(e) {
      e.preventDefault();
      
      const usernameInput = document.getElementById('username').value.trim();
      const passwordInput = document.getElementById('password').value.trim();

      // Check credentials
      if (usernameInput === 'cooper' && passwordInput === '0309') {
        errorMsg.style.display = 'none';
        celebrationModal.classList.add('active');
      } else {
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
