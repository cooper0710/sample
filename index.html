<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Celebration Page</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }

        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 320px;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        h2 {
            margin-bottom: 20px;
            color: #4a4a4a;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button, .btn-link {
            width: 100%;
            padding: 12px;
            background-color: #764ba2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 12px;
            transition: background 0.3s ease;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
        }

        button:hover, .btn-link:hover {
            background-color: #5a377d;
        }

        .error {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 8px;
        }

        /* Celebration Screen Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: flashLights 1s infinite alternate;
        }

        .modal-content {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 300px;
            box-shadow: 0 0 20px #fff;
        }

        /* Flashing celebration lights effect */
        @keyframes flashLights {
            0% { background-color: rgba(118, 75, 162, 0.85); }
            50% { background-color: rgba(230, 126, 34, 0.85); }
            100% { background-color: rgba(46, 204, 113, 0.85); }
        }
    </style>
</head>
<body>

    <div id="login-step" class="card">
        <h2>Login</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="checkLogin()">Sign In</button>
        <div id="login-error" class="error"></div>
    </div>

    <div id="age-step" class="card hidden">
        <h2>Welcome!</h2>
        <p>What's her age?</p>
        <input type="number" id="ageInput" placeholder="Enter age">
        <button onclick="submitAge()">Submit</button>
        <div id="age-error" class="error"></div>
    </div>

    <div id="celebration-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2 id="celebration-text"></h2>
            <a href="https://www.youtube.com" target="_blank" class="btn-link">Click Here</a>
        </div>
    </div>

    <script>
        function checkLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorDiv = document.getElementById('login-error');

            if (user === 'cooper' && pass === '0309') {
                errorDiv.innerText = '';
                document.getElementById('login-step').classList.add('hidden');
                document.getElementById('age-step').classList.remove('hidden');
            } else {
                errorDiv.innerText = 'Invalid username or password.';
            }
        }

        function submitAge() {
            const age = document.getElementById('ageInput').value;
            const errorDiv = document.getElementById('age-error');

            if (age.trim() === '') {
                errorDiv.innerText = 'Please enter an age.';
                return;
            }

            document.getElementById('celebration-text').innerText = 
                `Congratulations! You are happily ${age}`;
            
            document.getElementById('age-step').classList.add('hidden');
            document.getElementById('celebration-modal').classList.remove('hidden');
        }
    </script>
</body>
</html>
