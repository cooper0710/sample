<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Login Card */
        .login-card {
            background-color: #2a2a2a;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            width: 300px;
            text-align: center;
        }

        .login-card h2 {
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #444;
            background-color: #333;
            color: #fff;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #ff4081;
            border: none;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #e03570;
        }

        /* Overlay & Modal */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .popup {
            background: #222;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            position: relative;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            animation: fadeIn 0.5s ease-in-out;
        }

        .popup h1 {
            color: #fff;
            font-size: 24px;
            margin-bottom: 20px;
        }

        /* Celebration Lights Effect */
        .lights {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .light {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            animation: flash 1s infinite alternate;
        }

        .light:nth-child(1) { background-color: #ff5722; animation-delay: 0.1s; }
        .light:nth-child(2) { background-color: #ffeb3b; animation-delay: 0.3s; }
        .light:nth-child(3) { background-color: #4caf50; animation-delay: 0.5s; }
        .light:nth-child(4) { background-color: #00bcd4; animation-delay: 0.7s; }
        .light:nth-child(5) { background-color: #e91e63; animation-delay: 0.9s; }

        @keyframes flash {
            from { opacity: 0.3; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1.2); box-shadow: 0 0 10px currentColor; }
        }

        .video-btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #00bcd4;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 25px;
            transition: background 0.3s;
        }

        .video-btn:hover {
            background-color: #008ba3;
        }

        .error-message {
            color: #ff5252;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Login</h2>
        <form id="loginForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit">Submit</button>
            <div id="errorMsg" class="error-message">Invalid username or password.</div>
        </form>
    </div>

    <div class="overlay" id="popupOverlay">
        <div class="popup">
            <div class="lights">
                <div class="light"></div>
                <div class="light"></div>
                <div class="light"></div>
                <div class="light"></div>
                <div class="light"></div>
            </div>
            <h1 id="congratsText">Congratulations! You are happily [Age]! 🎉</h1>
            <a href="https://www.youtube.com" target="_blank" class="video-btn">Click Here</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            if (user === 'cooper' && pass === '0309') {
                errorMsg.style.display = 'none';
                document.getElementById('popupOverlay').style.display = 'flex';
            } else {
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
