<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #0f172a;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Login Card */
    .login-card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 400px;
      z-index: 10;
    }

    .login-card h2 {
      margin-bottom: 1.5rem;
      text-align: center;
      color: #38bdf8;
    }

    .input-group {
      margin-bottom: 1.2rem;
    }

    .input-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .input-group input {
      width: 100%;
      padding: 0.75rem;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    .input-group input:focus {
      border-color: #38bdf8;
    }

    button {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 6px;
      background: #0284c7;
      color: #fff;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #0369a1;
    }

    .error-msg {
      color: #ef4444;
      font-size: 0.85rem;
      margin-top: 0.5rem;
      text-align: center;
      display: none;
    }

    /* Modal Popup */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease;
      z-index: 100;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      background: #1e293b;
      padding: 3rem;
      border-radius: 16px;
      text-align: center;
      border: 2px solid #fbbf24;
      box-shadow: 0 0 30px rgba(251, 191, 36, 0.4);
      z-index: 101;
    }

    .modal-content h1 {
      font-size: 2rem;
      color: #f59e0b;
      animation: glow 1.5s infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px #f59e0b, 0 0 20px #f59e0b; }
      to { text-shadow: 0 0 20px #fbbf24, 0 0 30px #fbbf24; }
    }

    /* Celebration Lights Canvas */
    #lightsCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 99;
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>Account Login</h2>
    <form id="loginForm">
      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" required>
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit">Log In</button>
      <div class="error-msg" id="errorMsg">Invalid credentials. Please try again.</div>
    </form>
  </div>

  <div class="modal-overlay" id="successModal">
    <div class="modal-content">
      <h1>Congratulations, you are happily logged in! 🎉</h1>
    </div>
  </div>

  <canvas id="lightsCanvas"></canvas>

  <script>
    const loginForm = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const successModal = document.getElementById('successModal');
    const canvas = document.getElementById('lightsCanvas');
    const ctx = canvas.getContext('2d');

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;

      if (user === 'cooper' && pass === '0309') {
        errorMsg.style.display = 'none';
        successModal.classList.add('active');
        startCelebrationLights();
      } else {
        errorMsg.style.display = 'block';
      }
    });

    /* Particle Celebration Lights System */
    let particles = [];
    
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resizeCanvas);

    function startCelebrationLights() {
      canvas.style.display = 'block';
      resizeCanvas();
      
      const colors = ['#f59e0b', '#ec4899', '#8b5cf6', '#3b82f6', '#10b981', '#facc15'];
      
      for (let i = 0; i < 150; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 4 + 2,
          color: colors[Math.floor(Math.random() * colors.length)],
          vx: (Math.random() - 0.5) * 2,
          vy: (Math.random() - 0.5) * 2,
          alpha: Math.random(),
          glowing: Math.random() > 0.5
        });
      }
      
      animateLights();
    }

    function animateLights() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

        if (p.glowing) {
          p.alpha += 0.02;
          if (p.alpha >= 1) p.glowing = false;
        } else {
          p.alpha -= 0.02;
          if (p.alpha <= 0.2) p.glowing = true;
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.shadowBlur = 15;
        ctx.shadowColor = p.color;
        ctx.fill();
      });

      requestAnimationFrame(animateLights);
    }
  </script>
</body>
</html>
