<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login & Age Check</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    .container {
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        width: 300px;
        text-align: center;
    }
    input {
        width: 90%;
        padding: 8px;
        margin: 8px 0;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    button {
        padding: 8px 15px;
        background: #28a745;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }
    button:hover {
        background: #218838;
    }
    .hidden {
        display: none;
    }
    .success {
        color: green;
        font-weight: bold;
    }
</style>
</head>
<body>

<div class="container">
    <!-- Login Form -->
    <div id="loginForm">
        <h2>Login</h2>
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button onclick="checkLogin()">Login</button>
        <p id="loginError" style="color:red;"></p>
    </div>

    <!-- Age Form -->
    <div id="ageForm" class="hidden">
        <h2>What's your age?</h2>
        <input type="number" id="age" placeholder="Enter age" required>
        <button onclick="checkAge()">Submit</button>
        <p id="ageError" style="color:red;"></p>
    </div>

    <!-- Success Message -->
    <div id="successMessage" class="hidden">
        <h2 class="success">🎉 Successful First Stage! 🎉</h2>
    </div>
</div>

<script>
function checkLogin() {
    const user = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value.trim();
    const error = document.getElementById("loginError");

    if (user === "cooper" && pass === "0309") {
        document.getElementById("loginForm").classList.add("hidden");
        document.getElementById("ageForm").classList.remove("hidden");
        error.textContent = "";
    } else {
        error.textContent = "Invalid username or password.";
    }
}

function checkAge() {
    const age = document.getElementById("age").value.trim();
    const error = document.getElementById("ageError");

    if (/^\d{2}$/.test(age)) { // Checks if exactly 2 digits
        document.getElementById("ageForm").classList.add("hidden");
        document.getElementById("successMessage").classList.remove("hidden");
        error.textContent = "";
    } else {
        error.textContent = "Please enter a valid two-digit age.";
    }
}
</script>

</body>
</html>
