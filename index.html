<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Enter Your Age</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .age-container {
      max-width: 420px;
      margin: 48px auto;
      padding: 24px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      text-align: left;
      font-family: Arial, sans-serif;
    }
    .age-container h2 { text-align: center; margin-bottom: 12px; }
    .age-input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      margin: 8px 0 16px;
      box-sizing: border-box;
    }
    .actions {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    .actions button { flex: 1; padding: 10px; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="age-container" role="region" aria-labelledby="ageHeading">
    <h2 id="ageHeading">How old are you?</h2>

    <form id="ageForm" action="next_page.php" method="post" novalidate>
      <label for="age">Enter your age:</label>
      <input
        type="number"
        id="age"
        name="age"
        class="age-input"
        placeholder="e.g. 25"
        min="0"
        max="120"
        required
        aria-required="true"
      >

      <div class="actions">
        <button type="button" onclick="window.history.back()">Back</button>
        <button type="submit">Next</button>
      </div>
    </form>
  </div>

  <script>
    // Simple client-side validation for nicer UX
    document.getElementById('ageForm').addEventListener('submit', function (e) {
      const ageEl = document.getElementById('age');
      const age = Number(ageEl.value);
      if (!Number.isInteger(age) || age < 0 || age > 120) {
        e.preventDefault();
        alert('Please enter a valid whole number for age between 0 and 120.');
        ageEl.focus();
      }
    });
  </script>
</body>
</html>
