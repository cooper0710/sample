<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Celebration</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #ec4899;
      --accent-hover: #db2777;
      --text: #f8fafc;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .card {
      background: var(--card-bg);
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 360px;
      text-align: center;
      z-index: 10;
    }

    h2 {
      margin-bottom: 1.5rem;
      color: var(--text);
    }

    .input-group {
      margin-bottom: 1.2rem;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
      color: #94a3b8;
    }

    input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #0f172a;
      color: #fff;
      box-sizing: border-box;
      font-size: 1rem;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
    }

    button, .video-btn {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 8px;
      background-color: var(--accent);
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      text-decoration: none;
      display: inline-block;
      box-sizing: border-box;
      margin-top: 0.5rem;
    }

    button:hover, .video-btn:hover {
      background-color: var(--accent-hover);
    }

    .error {
      color: #f87171;
      font-size: 0.85rem;
      margin-top: 0.5rem;
      display: none;
    }

    /* Modal / Pop-up Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 2.5rem;
      border-radius: 16px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 0 30px rgba(236, 72, 153, 0.4);
      position: relative;
      animation: popIn 0.4s ease;
    }

    @keyframes popIn {
      from { transform: scale(0.8); }
      to { transform: scale(1); }
    }

    /* Celebration Lights Effect */
    .lights {
      position: absolute;
      top: -10px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-around;
    }

    .light {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      animation: flash 0.8s infinite alternate;
    }

    .light:nth-child(1) { background: #ff0055; animation-delay: 0.1s; }
    .light:nth-child(2) { background: #00ffcc; animation-delay: 0.3s; }
    .light:nth-child(3) { background: #ffcc00; animation-delay: 0.2s; }
    .light:nth-child(4) { background: #ff00ff; animation-delay: 0.4s; }
    .light:nth-child(5) { background: #00ff00; animation-delay: 0.15s; }

    @keyframes flash {
      from { opacity: 0.3; box-shadow: none; }
      to { opacity: 1; box-shadow: 0 0 10px currentColor; }
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div id="loginCard" class="card">
    <h2>Login</h2>
    <div class="input-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Enter username">
    </div>
    <div class="input-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter password">
    </div>
    <button onclick="handleLogin()">Sign In</button>
    <div id="loginError" class="error">Invalid username or password.</div>
  </div>

  <div id="ageCard" class="card hidden">
    <h2>Security Question</h2>
    <div class="input-group">
      <label for="ageInput">What's her age?</label>
      <input type="number" id="ageInput" placeholder="Enter her age">
    </div>
    <button onclick="handleAgeSubmit()">Submit</button>
    <div id="ageError" class="error">Please enter a valid age.</div>
  </div>

  <div id="celebrationModal" class="modal-overlay">
    <div class="modal-content">
      <div class="lights">
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
      </div>
      <h1 style="color: #ec4899; margin-top: 10px;">🎉 Congratulations! 🎉</h1>
      <p id="celebrationText" style="font-size: 1.2rem; line-height: 1.5; margin: 1.5rem 0;"></p>
      
      <a id="videoTab" href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" class="video-btn">Click Here</a>
    </div>
  </div>

  <script>
    function handleLogin() {
      const usernameInput = document.getElementById('username').value.trim();
      const passwordInput = document.getElementById('password').value.trim();
      const loginError = document.getElementById('loginError');

      if (usernameInput === 'cooper' && passwordInput === '0309') {
        loginError.style.display = 'none';
        document.getElementById('loginCard').classList.add('hidden');
        document.getElementById('ageCard').classList.remove('hidden');
      } else {
        loginError.style.display = 'block';
      }
    }

    function handleAgeSubmit() {
      const ageVal = document.getElementById('ageInput').value.trim();
      const ageError = document.getElementById('ageError');

      if (ageVal !== '' && !isNaN(ageVal) && Number(ageVal) > 0) {
        ageError.style.display = 'none';
        
        // Update popup message dynamically
        const celebrationText = document.getElementById('celebrationText');
        celebrationText.textContent = `You are happily ${ageVal}!`;

        // Show celebration popup
        document.getElementById('celebrationModal').classList.add('active');
      } else {
        ageError.style.display = 'block';
      }
    }
  </script>
</body>
</html>
