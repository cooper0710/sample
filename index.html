<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Multi-Step Login</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }
    .container {
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        width: 300px;
        text-align: center;
    }
    input {
        width: 90%;
        padding: 8px;
        margin: 8px 0;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    button {
        padding: 10px 15px;
        background: #28a745;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }
    button:hover {
        background: #218838;
    }
    .celebration {
        font-size: 2em;
        color: white;
        background: #28a745;
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }
</style>
</head>
<body>

<div class="container" id="loginBox">
    <h2>Login</h2>
    <input type="text" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>
    <button onclick="checkLogin()">Login</button>
    <p id="loginError" style="color:red;"></p>
</div>

<div class="container" id="ageBox" style="display:none;">
    <h2>What's your age?</h2>
    <input type="number" id="age" placeholder="Enter 2-digit age" min="10" max="99" required>
    <button onclick="checkAge()">Submit</button>
    <p id="ageError" style="color:red;"></p>
</div>

<div id="celebrationBox" style="display:none;">
    <div class="celebration">
        🎉 1st Stage of life is completed 🎉
    </div>
</div>

<script>
function checkLogin() {
    const user = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value.trim();
    const error = document.getElementById("loginError");

    if (user === "cooper" && pass === "0309") {
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("ageBox").style.display = "block";
        error.textContent = "";
    } else {
        error.textContent = "Invalid username or password.";
    }
}

function checkAge() {
    const age = document.getElementById("age").value.trim();
    const error = document.getElementById("ageError");

    if (/^\d{2}$/.test(age)) { // exactly 2 digits
        document.getElementById("ageBox").style.display = "none";
        document.getElementById("celebrationBox").style.display = "block";
        error.textContent = "";
    } else {
        error.textContent = "Please enter a valid 2-digit age.";
    }
}
</script>

</body>
</html>
